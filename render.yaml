services:
  - type: web
    name: nexus-agent
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: OLLAMA_MODEL
        value: dolphin3
      - key: OLLAMA_URL
        value: http://localhost:11434/api/generate
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
    routes:
      - path: /
        matchType: prefix
